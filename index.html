<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris online freee!!!!!!?</title>
    <style>
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), 
                        url('https://images.unsplash.com/photo-1550745165-9bc0b252726f?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            
            color: white;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            margin: 0 0 15px 0;
            font-size: 2.5rem;
            color: #c00404;
            text-shadow: 0 0 10px #cb0202, 0 0 20px #fb1d1d;
            letter-spacing: 8px;
        }

        #game-container {
            border: 4px solid #333;
            border-top-color: #555;
            border-left-color: #555;
            box-shadow: 0 0 40px rgba(0,0,0,0.8), inset 0 0 10px #000;
            line-height: 0;
            background-color: #000;
        }

        canvas {
            background-color: #8d8d8d;
            display: block;
        }

        .info {
            margin-top: 15px;
            color: #aaa;
            font-size: 0.8rem;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <h1>TETRIS!</h1>

    <div id="game-container">
        <canvas id="tetris" width="240" height="480"></canvas>
    </div>

    <p class="info">← → Arrows to Move to the sides • ↑ to flip the piece • ↓ to drop faster</p>

    <script src="tetris.js"></script>
</body>
</html>
